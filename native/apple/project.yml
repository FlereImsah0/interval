name: IntervalTimer
options:
  deploymentTarget:
    iOS: "17.2"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
      - path: ../../web/icon-192.png
        buildPhase: resources
      - path: ../../web/fonts/OFL-Barlow.txt
        buildPhase: resources
      - path: ../../web/welcome-sports.jpg
        buildPhase: resources
      - path: ../../web/voice
        buildPhase: resources
      - path: ../audio
        buildPhase: resources
    dependencies:
      - target: IntervalTimerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fleresjourney.intervaltimer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/Phone-Info.plist
      properties:
        CFBundleDisplayName: Interval Timer
        UIAppFonts: [BarlowCondensed-Bold.ttf]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.fleresjourney.intervaltimer
            CFBundleURLSchemes: [intervaltimer]
    entitlements:
      path: Config/Phone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fleresjourney.intervaltimer]
  IntervalTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Phone/TimerSurfaces.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fleresjourney.intervaltimer.widgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Widgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fleresjourney.intervaltimer]
  IntervalTimerWatch:
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
      - path: ../../web/icon-192.png
        buildPhase: resources
      - path: ../../web/fonts/OFL-Barlow.txt
        buildPhase: resources
      - path: ../../web/welcome-sports.jpg
        buildPhase: resources
      - path: ../../web/voice
        type: folder
        buildPhase: resources
      - path: ../audio
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fleresjourney.intervaltimer.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Interval Timer
        UIAppFonts: [BarlowCondensed-Bold.ttf]
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes: [workout-processing]
        UIBackgroundModes: [audio]
        NSHealthShareUsageDescription: Interval Timer uses workout permission to keep the timer running on Apple Watch while you exercise.
        NSHealthUpdateUsageDescription: Interval Timer starts an exercise session for timer cues. The workout is discarded when you finish.
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
